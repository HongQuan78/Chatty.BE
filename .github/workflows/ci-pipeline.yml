name: "PR .NET Quality Gate"

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore Chatty.BE.sln

      - name: Verify formatting
        run: dotnet format Chatty.BE.sln --verify-no-changes --severity warn --no-restore

      - name: Build solution
        run: dotnet build Chatty.BE.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Chatty.BE.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Security scan (NuGet vulnerability audit)
        run: |
          dotnet list Chatty.BE.sln package --vulnerable --include-transitive
